name: Tests

on:
  push:
    branches:
      - dev-upstream
      - hydra-config-refactor
  pull_request:
    branches:
      - dev-upstream
      - hydra-config-refactor

permissions: read-all

jobs:
  # Fast lint job - runs first, fails fast
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@v4

      - name: Install ruff
        run: uv pip install ruff --system

      - name: Run ruff check
        run: ruff check . --output-format=github

      - name: Run ruff format check
        run: ruff format --check .

  # Test job - runs on multiple Python/PyTorch versions
  # Note: xformers/triton require CUDA and are not tested in CI (CPU-only runners)
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # REMOVED "3.10" because it conflicts with modern scipy/torch versions
        python-version: ["3.11", "3.12", "3.13"]
        pytorch-version: ["2.9.0"]
        include:
          # Also test older PyTorch for backward compatibility
          - python-version: "3.11"
            pytorch-version: "2.6.0"

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: |
          uv pip install torch==${{ matrix.pytorch-version }} torchvision --index-url https://download.pytorch.org/whl/cpu --system
          uv pip install dadaptation==3.2 pytest==8.3.4 pytest-cov --system
          uv pip install -r requirements.txt --system

      - name: Run tests with coverage
        run: pytest --cov=library --cov-report=xml --cov-report=term-missing -v
        continue-on-error: true # Don't fail the build while we have known failing tests

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.11' && matrix.pytorch-version == '2.9.0'
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

[project]
name = "sd-scripts"
version = "0.1.1"
description = "Training"
readme = "README.md"
# Baseline runtime is CPython 3.14 free-threaded (3.14t). PEP 440's
# requires-python field cannot express the free-threaded ABI separately.
requires-python = ">=3.14,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE*"]

dependencies = [
    # Hugging Face stack. The project targets the current API generation rather
    # than retaining Transformers 4 / Hub 0.x compatibility paths.
    "accelerate>=1.15.0,<2",
    "transformers>=5.19.0,<6",
    "diffusers>=0.41.0,<0.42",
    "ftfy>=6.3.1,<7",

    # OpenCV 5.0.0.93 has no cp314t wheel. On the NixOS-WSL baseline it is
    # built successfully from source with PYTHON3_LIMITED_API=OFF; see
    # tool.uv.extra-build-variables below. Its cv2 extension currently does
    # not declare free-threading safety, so importing it re-enables the GIL.
    "opencv-python>=5.0.0.93,<5.1",

    "einops>=0.8.2,<0.9",
    "bitsandbytes>=0.50.2,<0.51",
    "lion-pytorch>=0.2.5,<0.3",
    "schedulefree>=1.4.1,<1.5",

    # TODO: 4.0 is a major pytorch_optimizer upgrade from the old 3.8.2 pin.
    # Smoke-test imported optimizer names, constructor arguments, state loading,
    # and training behavior before treating this as migration-complete.
    "pytorch_optimizer>=4.0.0,<5",

    "prodigy-plus-schedule-free>=2.0.1,<2.1",
    "prodigyopt>=1.1.2,<1.2",
    "dadaptation>=3.2,<4",
    "came-pytorch>=0.1.3,<0.2",
    "torchastic>=0.1.2,<0.2",
    "torch-optimi>=0.3.3,<0.4",

    # TODO: adv_optm moved from the old 1.2.x line to 2.5.x. Verify optimizer
    # names/options and checkpoint/state compatibility used by this repository.
    "adv_optm>=2.5.13,<3",

    "kornia>=0.8.3,<0.9",

    # grpcio 1.78.0 installs successfully on the 3.14t NixOS-WSL baseline,
    # but grpc._cython.cygrpc currently does not declare free-threading safety,
    # so TensorBoard/grpc usage can re-enable the GIL.
    "tensorboard>=2.21.0,<2.22",

    # 0.9.0rc1 is intentionally a pre-release: it publishes dedicated cp314t
    # wheels while the previous stable line does not.
    "safetensors>=0.9.0rc1,<0.10",
    "wandb>=0.30.0,<0.31",
    "toml>=0.10.2,<0.11",
    "voluptuous>=0.16.0,<0.17",

    # NOTE: huggingface-hub 2.x is newer, but diffusers 0.41 currently requires
    # huggingface-hub <2. Raise this together when that compatibility cap moves.
    "huggingface-hub[hf_xet]>=1.33.0,<2",
    "hf-xet>=1.7.0,<2",

    "matplotlib>=3.11.2,<3.12",
    "scipy>=1.18.1,<1.19",

    # TODO: RamTorch was not part of the native-wheel blockers, but its runtime
    # behavior should be smoke-tested against Torch 2.14.1 before widening the pin.
    "RamTorch~=0.2.2",

    "PyWavelets>=1.10.0,<1.11",
    "imagesize>=2.0.1,<3",
    "numpy>=2.5.3,<2.6",

    # Hydra 1.3 breaks under Python 3.14 argparse validation. The tested
    # 3.14t baseline currently uses the 1.4 release-candidate line.
    "hydra-core>=1.4.0rc1,<1.5",

    "blake3>=1.0.11,<2",
    "rich>=15.0.0,<16",
    "sentencepiece>=0.2.2,<0.3",

    # Torch 2.14.1 + CUDA 13 is the single supported Torch generation.
    # Eager CUDA has been verified on CPython 3.14t with the GIL remaining
    # disabled. Triton-backed paths such as torch.compile currently re-enable
    # the GIL because triton._C.libtriton has not declared free-threading safety.
    "torch>=2.14.1,<2.15",
    "torchvision>=0.29.1,<0.30",
    "torchao>=0.18.0,<0.19",
    "nvidia-ml-py>=13.615.71,<14",

    # Triton is supplied transitively by the Linux Torch distribution; do not
    # add it as a direct dependency. Triton 3.8 works with torch.compile on the
    # NixOS-WSL baseline, but its native extension currently re-enables the GIL.
    #
    # Native Windows 3.14t remains unblessed: triton-windows 3.8 does not
    # currently provide the required cp314t wheel.
    # "triton-windows>=3.8,<3.9; platform_system == 'Windows'",
]

[project.optional-dependencies]
# TODO(3.14t/Windows): ONNX Runtime 1.31 publishes cp314t wheels for Linux,
# but its Windows 3.14 wheels are still cp314 rather than cp314t. These extras
# remain available for investigation but are not yet part of the blessed 3.14t
# Windows environment.
onnx-cpu = ["onnxruntime>=1.31.0,<2"]
onnx-gpu = ["onnxruntime-gpu>=1.31.0,<2"]

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.4.0,<2",
    "pytest-cov>=7.1,<8",
    "pytest-xdist>=3.8,<4",
    "ruff>=0.17.0",
    "ty>=0.0.86",
]

[tool.uv]
required-version = ">=0.12"
package = false
default-groups = ["dev"]
conflicts = [
    [
        { extra = "onnx-cpu" },
        { extra = "onnx-gpu" },
    ],
]

# The project uses one opinionated CUDA/Torch stack. Users who need a different
# PyTorch index can override their environment with uv rather than selecting a
# maintained matrix of project extras.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[tool.uv.extra-build-variables]
# OpenCV currently enables CPython's Limited API by default when building from
# source. CPython 3.14t does not support the Limited API, so disable it for the
# free-threaded build. Remove once opencv-python handles 3.14t upstream.
opencv-python = { CMAKE_ARGS = "-DPYTHON3_LIMITED_API=OFF" }

# =============================================================================
# Ruff - Linting and Formatting
# =============================================================================
[tool.ruff]
target-version = "py314"
line-length = 140

exclude = [
    ".git",
    ".venv",
    ".venv-wsl",
    "venv",
    "__pycache__",
    "*.egg-info",
    "feather",                  # Vendored library
    "library/vendor",           # Vendored third-party code
    "library/performance/ipex", # Intel GPU support (specialized hijacks)
    "_deprecated",              # Deprecated code
    "scripts"
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    # "I",    # isort - disabled, using custom import ordering
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "C4",     # flake8-comprehensions
    "TID252", # ban parent-relative imports

    "RUF",    # Ruff correctness / suppression / config checks
    "NPY",    # NumPy API/deprecation checks

    # Useful blocking-operation checks for asyncio code.
    "ASYNC220", # blocking subprocess creation in async
    "ASYNC230", # blocking open() in async
    "ASYNC240", # blocking filesystem operations in async
    "ASYNC250", # blocking input() in async
    "ASYNC251", # time.sleep() in async
]

ignore = [
    "E501",   # line too long (handled by formatter)
    "E741",   # ambiguous variable name (common in ML code: l, I, O)
    "B008",   # function call in default argument (dataclasses pattern)
    "SIM108", # ternary operator (sometimes less readable)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # Allow assert in tests
"scripts/*" = ["T201"]  # Allow print() in scripts

# isort disabled - using custom import ordering script instead

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# =============================================================================
# Pytest - Testing
# =============================================================================
[tool.pytest]
minversion = "9.1"
strict = true

testpaths = ["tests"]
pythonpath = ["."]

addopts = [
    "-ra",
    "--ignore=tests/_deprecated",
]

asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"

markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "config: marks tests for configuration/dataclass functionality",
    "training: marks tests for training modules",
    "data: marks tests for data loading modules",
    "requires_gpu: marks tests that require GPU access",
]

# =============================================================================
# Coverage - Test Coverage
# =============================================================================
[tool.coverage.run]
source = ["library"]
branch = true
relative_files = true

omit = [
    "*/tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.coverage.html]
directory = "htmlcov"

# =============================================================================
# ty - Type Checking
# =============================================================================
[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
# Exclude vendored/_deprecated code from type checking
exclude = [
    ".git",
    ".venv",
    ".venv-wsl",
    "venv",
    "__pycache__",
    "feather",           # Vendored library
    "tools",             # Standalone scripts (argparse)
    "data_processing",   # Legacy scripts not yet migrated
    "upscaling",         # Legacy scripts not yet migrated
    "_deprecated",       # Deprecated code
    "scripts"
]

[tool.ty.rules]
# Enable useful conservative diagnostics that ty leaves disabled by default.
possibly-unresolved-reference = "warn"
possibly-missing-attribute = "warn"
# invalid-argument-type = "warn"
# unresolved-attribute = "warn"

[project]
name = "sd-scripts"
version = "0.1.0"
description = "Training scripts for Stable Diffusion with Hydra configuration"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "Apache-2.0"}

dependencies = [
    "accelerate~=1.11.0",
    "transformers~=4.54.1",
    "diffusers~=0.35.2",
    "ftfy~=6.3.1",
    "opencv-python~=4.12.0.88",
    "einops~=0.8.1",
    "bitsandbytes~=0.48.2",
    "lion-pytorch~=0.2.3",
    "schedulefree~=1.4.1",
    "pytorch_optimizer==3.8.2",
    "prodigy-plus-schedule-free~=2.0.1",
    "prodigyopt~=1.1.2",
    "dadaptation~=3.2",
    "came-pytorch~=0.1.3",
    "torchastic~=0.1.2",
    "torch-optimi~=0.3.2",
    "adv_optm~=1.2.3",
    "customized-optimizers",
    "kornia~=0.8.2",
    "tensorboard~=2.20.0",
    "safetensors~=0.6.2",
    "wandb~=0.22.3",
    "toml~=0.10.2",
    "voluptuous~=0.15.2",
    "huggingface-hub[hf_xet]~=0.36.0",
    "hf-xet~=1.2.0",
    "matplotlib~=3.10.7",
    "scipy~=1.16.2",
    "RamTorch~=0.2.2",
    "PyWavelets~=1.9.0",
    "imagesize~=1.4.1",
    "numpy~=2.2.6",
    "hydra-core",
    "blake3",
    "rich~=14.2.0",
    "sentencepiece~=0.2.1",
    "torch>=2.9,<2.11",
    "torchvision",
    "xformers",
    "ruff>=0.15.1",
    "ty>=0.0.17",
]

# Torch profiles. Pick exactly one for your machine.
[project.optional-dependencies]
torch-cu128 = ["torch", "torchvision"]
torch-cu129 = ["torch", "torchvision"]
torch-cu130 = ["torch", "torchvision"]

# Torch version profiles. Pick exactly one.
torch-v29 = [
    "torch>=2.9,<2.10",
    "triton-windows>=3.5,<3.6; platform_system == 'Windows'",
]
torch-v210 = [
    "torch>=2.10,<2.11",
    "triton-windows>=3.6,<3.7; platform_system == 'Windows'",
]

onnx-cpu = ["onnxruntime>=1.20"]
onnx-gpu = ["onnxruntime-gpu>=1.20"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
]

[tool.uv]
package = false
default-groups = ["dev"]
index-strategy = "unsafe-best-match"
conflicts = [
    [
        { extra = "torch-cu128" },
        { extra = "torch-cu129" },
        { extra = "torch-cu130" },
    ],
    [
        { extra = "torch-v29" },
        { extra = "torch-v210" },
    ],
    [
        { extra = "onnx-cpu" },
        { extra = "onnx-gpu" },
    ],
    [
        { extra = "torch-cu129" },
        { extra = "torch-v29" },
        { extra = "torch-v210" },
    ],
    [
        { extra = "torch-cu128" },
        { extra = "torch-v210" },
    ],
    [
        { extra = "torch-cu130" },
        { extra = "torch-v29" },
    ],
]


[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", extra = "torch-cu128" },
    { index = "pytorch-cu129", extra = "torch-cu129" },
    { index = "pytorch-cu130", extra = "torch-cu130" },
]
torchvision = [
    { index = "pytorch-cu128", extra = "torch-cu128" },
    { index = "pytorch-cu129", extra = "torch-cu129" },
    { index = "pytorch-cu130", extra = "torch-cu130" },
]
customized-optimizers = { git = "https://github.com/67372a/customized-optimizers" }

# =============================================================================
# Ruff - Linting and Formatting
# =============================================================================
[tool.ruff]
target-version = "py311"
line-length = 140

exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "*.egg-info",
    "feather",                  # Vendored library
    "library/vendor",           # Vendored third-party code
    "library/performance/ipex", # Intel GPU support (specialized hijacks)
    "_deprecated",              # Deprecated code
    "scripts"
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    # "I",    # isort - disabled, using custom import ordering
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "C4",     # flake8-comprehensions
    "TID252", # ban relative imports
]

ignore = [
    "E501",   # line too long (handled by formatter)
    "E741",   # ambiguous variable name (common in ML code: l, I, O)
    "B008",   # function call in default argument (dataclasses pattern)
    "B905",   # zip without strict= (3.10+ only)
    "SIM108", # ternary operator (sometimes less readable)
]

fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # Allow assert in tests
"scripts/*" = ["T201"]  # Allow print() in scripts

# isort disabled - using custom import ordering script instead

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# =============================================================================
# Pytest - Testing
# =============================================================================
[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
pythonpath = ["."]

filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
    "ignore::FutureWarning",
]

addopts = [
    "--strict-markers",
    "-ra",
    "--ignore=tests/_deprecated",
]

markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "config: marks tests for configuration/dataclass functionality",
    "training: marks tests for training modules",
    "data: marks tests for data loading modules",
    "requires_gpu: marks tests that require GPU access",
]

# =============================================================================
# Coverage - Test Coverage
# =============================================================================
[tool.coverage.run]
source = ["library"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.coverage.html]
directory = "htmlcov"

# =============================================================================
# ty - Type Checking
# =============================================================================
[tool.ty.environment]
python-version = "3.11"
python = "./.venv"

[tool.ty.src]
# Exclude vendored/_deprecated code from type checking
exclude = [
    "feather",           # Vendored library
    "tools",             # Standalone scripts (argparse)
    "data_processing",   # Legacy scripts not yet migrated
    "upscaling",         # Legacy scripts not yet migrated
    "_deprecated",       # Deprecated code
    "scripts"
]

[tool.ty.rules]
# Downgrade noisy rules to warnings for gradual adoption
possibly-unresolved-reference = "warn"
invalid-argument-type = "warn"
possibly-missing-attribute = "warn"
unresolved-attribute = "warn"

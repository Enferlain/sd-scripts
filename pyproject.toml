[project]
name = "sd-scripts"
version = "0.1.0"
description = "Training scripts for Stable Diffusion with Hydra configuration"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["library*", "scripts*", "tools*"]

# =============================================================================
# Ruff - Linting and Formatting
# =============================================================================
[tool.ruff]
target-version = "py310"
line-length = 140

exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "*.egg-info",
    "feather",  # Vendored library
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    # "I",    # isort - disabled, using custom import ordering
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "C4",     # flake8-comprehensions
    "TID252", # ban relative imports
]

ignore = [
    "E501",   # line too long (handled by formatter)
    "E741",   # ambiguous variable name (common in ML code: l, I, O)
    "B008",   # function call in default argument (dataclasses pattern)
    "B905",   # zip without strict= (3.10+ only)
    "SIM108", # ternary operator (sometimes less readable)
]

fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # Allow assert in tests
"scripts/*" = ["T201"]  # Allow print() in scripts

# isort disabled - using custom import ordering script instead

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# =============================================================================
# Pytest - Testing
# =============================================================================
[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
pythonpath = ["."]

filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
    "ignore::FutureWarning",
]

addopts = [
    "--strict-markers",
    "-ra",
]

markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "config: marks tests for configuration/dataclass functionality",
    "training: marks tests for training modules",
    "data: marks tests for data loading modules",
    "requires_gpu: marks tests that require GPU access",
]

# =============================================================================
# Coverage - Test Coverage
# =============================================================================
[tool.coverage.run]
source = ["library"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.coverage.html]
directory = "htmlcov"


# Configuration for sdxl_textual_inversion.py
# SDXL Textual Inversion Training

defaults:
  - sdxl_textual_inversion_schema
  - optimizer: default
  - data: default
  - model: default
  - sdxl: default
  - training: default
  - output: default
  - performance: default
  - loss: default
  - timestep: default
  - validation: default
  - _self_

# Textual Inversion specific settings
textual_inversion:
  weights: null # Path to pre-trained embeddings to load
  num_vectors_per_token: 1 # Number of vectors per token
  token_string: null # Token string to use for training
  init_word: null # Word to initialize embeddings from
  use_object_template: false # Use object templates for captions
  use_style_template: false # Use style templates for captions

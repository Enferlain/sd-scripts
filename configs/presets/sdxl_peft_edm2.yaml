# @package _global_

# Configuration for sdxl_peft.py
# SDXL PEFT/LoRA Training with EDM2 loss weighting enabled

defaults:
  - /presets/sdxl_peft
  - _self_

loss:
  edm2:
    enabled: true
    importance:
      enabled: true
    optimizer:
      use_scheduler: true
    visualization:
      enabled: true
      every_n_steps: 100
      output_dir: "./edm2_plots"

output:
  saving:
    output_name: "sdxl_peft_edm2"

# @package _global_

# Configuration for sd_finetune.py
# SD 1.5/2.0 Full Model Fine-tuning
#
# Note: train_text_encoder is now controlled via optimizer.learning_rates.text_encoders
# Set a text encoder learning rate to enable TE training (LR-based control per Schema 1)

defaults:
  - /run_schema
  - /_defaults/optimizer: default
  - /_defaults/data: default
  - /_defaults/model: default
  - /_defaults/training: default
  - /_defaults/output: default
  - /_defaults/performance: default
  - /_defaults/loss: default
  - /_defaults/timestep: default
  - /_defaults/validation: default
  - _self_

mode: finetune

model:
  model_type: sd15

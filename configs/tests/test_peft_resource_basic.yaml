# @package _global_
# ═══════════════════════════════════════════════════════════════════════════
# SDXL PEFT Integration Test: Resource Monitor (Basic)
# ═══════════════════════════════════════════════════════════════════════════
# Usage: python -m scripts.sdxl_peft --config-name=tests/test_peft_resource_basic

defaults:
  - /tests/test_core
  - _self_

output:
  saving:
    output_name: "test_peft_resource_basic"
  logging:
    benchmark_report:
      enabled: true
    resource_monitor:
      enabled: true
      mode: "basic"
      rank_scope: "main"
      log_every_n_steps: 0

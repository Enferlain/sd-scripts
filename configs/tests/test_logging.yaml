# @package _global_
# ═══════════════════════════════════════════════════════════════════════════
# SDXL PEFT Integration Test: Logging
# ═══════════════════════════════════════════════════════════════════════════
# Usage: python scripts/sdxl_peft.py --config-name=tests/test_logging

defaults:
  - /tests/test_core
  - _self_

output:
  logging:
    log_with: "tensorboard" # Easier to test locally than wandb
    logging_dir: "D:/Projects/sd-scripts/tests/test_logs"
    log_tracker_name: "peft_test"
    log_timestep_distribution_every_n_steps: 10

# @package _global_
# ═══════════════════════════════════════════════════════════════════════════
# SDXL PEFT Integration Test: LoHa Mixed Targeting
# ═══════════════════════════════════════════════════════════════════════════
# Usage: python train.py --config-name=tests/test_peft_target_loha_mixed
#
# Purpose:
# - exercise the repo-owned LoHa runtime on real module-resolved targets
# - target the denoiser plus the second text encoder
# - disable TE-output caching so the TE path can train

defaults:
  - /tests/test_core
  - _self_

output:
  saving:
    output_name: "test_peft_target_loha_mixed"
  logging:
    benchmark_report:
      enabled: true
    resource_monitor:
      enabled: true
      mode: "sampled"
      rank_scope: "main"
      log_every_n_steps: 0
      sample_interval_sec: 0.5
      output_jsonl: "resource_monitor_target_loha_mixed.jsonl"

data:
  caching:
    cache_text_encoder_outputs: false
    cache_text_encoder_outputs_to_disk: false

adapter:
  peft:
    loha:
      rank: 32
      alpha: 16.0
      use_scalar: true
      bypass_mode: true

optimizer:
  optimizer_type: "AdamW8bit"
  learning_rates:
    base: null
    denoiser: 1e-4
    text_encoders: [0.0, 1e-4]

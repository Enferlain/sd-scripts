# @package _global_
# ═══════════════════════════════════════════════════════════════════════════
# SDXL PEFT Integration Test: Denoiser-Only Targeting
# ═══════════════════════════════════════════════════════════════════════════
# Usage: python train.py --config-name=tests/test_peft_target_denoiser_only
#
# Purpose:
# - keep PEFT targeting on the denoiser only
# - preserve TE-output caching
# - provide a simple baseline config for adapter target-selection checks

defaults:
  - /tests/test_core
  - _self_

output:
  saving:
    output_name: "test_peft_target_denoiser_only"
  logging:
    benchmark_report:
      enabled: true
    resource_monitor:
      enabled: true
      mode: "sampled"
      rank_scope: "main"
      log_every_n_steps: 0
      sample_interval_sec: 0.5
      output_jsonl: "resource_monitor_target_denoiser_only.jsonl"

optimizer:
  optimizer_type: "AdamW8bit"
  learning_rates:
    # No shared fallback: only explicitly positive component LRs should train.
    base: null
    denoiser: 1e-4
    # Explicitly frozen so this config stays denoiser-only.
    text_encoders: [0.0, 0.0]

# @package _global_
# ═══════════════════════════════════════════════════════════════════════════
# SDXL PEFT Integration Test: Sampling
# ═══════════════════════════════════════════════════════════════════════════
# Usage: python scripts/sdxl_peft.py --config-name=tests/test_sampling

defaults:
  - /tests/test_core
  - _self_

output:
  sampling:
    sample_sampler: "k_euler"
    sample_every_n_steps: 10
    sample_at_first: true
    # NOTE: sample_every_n_epochs takes precedence - comment it out to use step-based
    # sample_every_n_epochs: 1
    sample_prompts: "D:/Projects/sd-scripts/tests/assets/3prompt.txt"

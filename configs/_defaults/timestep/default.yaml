# @package timestep

# Timestep configuration
timestep_sampling: uniform # shared: uniform | log_snr_uniform | adaptive_log_snr | logit_normal ; RF-only: cosine_shaped
min_timestep: null
max_timestep: null
dynamic_timestep_schedule: null
training_shift: 1.0
rf_loss_weighting_scheme: uniform
logit_mean: 0.0
logit_std: 1.0
cosine_shape_scale: 1.29

# Adaptive log-SNR sampler
adaptive_log_snr:
  bins: 32
  ema_beta: 0.9
  temperature: 0.5
  prior_weight: 0.25
  min_prob: 0.0001
  warmup_steps: 2000
  entropy_floor: 0.7
  uniform_mix_when_low_entropy: 0.1

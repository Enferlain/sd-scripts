# @package timestep

# Timestep configuration
timestep_sampling: uniform # uniform | shift | log_snr_uniform | adaptive_log_snr
min_timestep: null
max_timestep: null
dynamic_timestep_schedule: null
sigmoid_scale: 1.0
discrete_flow_shift: 1.0

# Adaptive log-SNR sampler
adaptive_log_snr:
  bins: 32
  ema_beta: 0.9
  temperature: 0.5
  prior_weight: 0.25
  min_prob: 0.0001
  warmup_steps: 2000
  entropy_floor: 0.7
  uniform_mix_when_low_entropy: 0.1

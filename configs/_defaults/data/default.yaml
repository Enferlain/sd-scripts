# @package data

source:
  train_data_dir: null
  reg_data_dir: null
  val_data_dir: null
  dataset_config: null
  in_json: null
  dataset_class: null
  dataset_repeats: 1
  subsets: []

preprocessing:
  resolution: "512,512"
  resize_interpolation: null
  alpha_mask: false
  flip_aug: false
  color_aug: false
  random_crop: false
  face_crop_aug_range: null
  debug_dataset: false

caption:
  caption_extension: ".caption"
  caption_extention: null
  caption_separator: ","
  shuffle_caption: false
  keep_tokens: 0
  keep_tokens_separator: ""
  secondary_separator: null
  enable_wildcard: false
  caption_prefix: null
  caption_suffix: null
  caption_dropout_rate: 0.0
  caption_dropout_every_n_epochs: 0
  caption_tag_dropout_rate: 0.0
  weighted_captions: false
  token_warmup_min: 1
  token_warmup_step: 0.0

bucketing:
  enable_bucket: false
  min_bucket_reso: 256
  max_bucket_reso: 1024
  bucket_reso_steps: 64
  bucket_no_upscale: false

caching:
  cache_dir: null
  tokenizer_cache_dir: null
  cache_latents: false
  cache_latents_to_disk: false
  cache_text_encoder_outputs: false
  cache_text_encoder_outputs_to_disk: false
  disable_mmap_load_safetensors: false
  vae_batch_size: 1
  te_batch_size: 4
  num_workers: 4
  skip_cache_check: false
  cache_tokens_per_epoch: false

loader:
  num_workers: 4
  persistent_workers: false
  prefetch_factor: 2
  pin_memory: true

# @package loss

# Loss configuration with nested subcategories
loss_type: "l2"
loss_scale: 1.0
loss_multiplier: null
prior_loss_weight: 1.0
v_parameterization: false

huber:
  huber_schedule: "snr"
  huber_c: 0.1
  huber_scale: 1.0

snr:
  min_snr_gamma: null
  scale_v_pred_loss_like_noise_pred: false
  v_pred_like_loss: null
  debiased_estimation_loss: false

masked:
  masked_loss: false
  conditioning_data_dir: null

regularization:
  noise_offset: null
  noise_offset_random_strength: false
  multires_noise_iterations: null
  multires_noise_discount: 0.3
  ip_noise_gamma: null
  ip_noise_gamma_random_strength: false
  adaptive_noise_scale: null
  zero_terminal_snr: false

edm2:
  enabled: false
  laplace_timestep_sampling: false
  num_channels: 128
  initial_weights: null
  optimizer:
    type: "torch.optim.AdamW"
    lr: 0.02
    args: "{'weight_decay': 0, 'betas': (0.9,0.999)}"
    use_scheduler: false
    warmup_percent: 0.1
    constant_percent: 0.1
    decay_scaling: 1.0
  importance:
    enabled: false
    max_weight: 10.0
    min_snr_gamma: 1.0
    safety_override: false
  visualization:
    enabled: false
    every_n_steps: 20
    output_dir: null
    y_limit: null
    y_scale: "linear"

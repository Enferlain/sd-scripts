# @package _global_

# Internal full-schema baseline for config tooling and ad hoc composition.
#
# This file intentionally stays neutral: it composes the active nested schema
# defaults without selecting a training mode or model family.

defaults:
  - /run_schema
  - /_defaults/optimizer: default
  - /_defaults/data: default
  - /_defaults/model: default
  - /_defaults/objective: default
  - /_defaults/adapter: default
  - /_defaults/training: default
  - /_defaults/output: default
  - /_defaults/performance: default
  - /_defaults/loss: default
  - /_defaults/timestep: default
  - /_defaults/validation: default
  - _self_

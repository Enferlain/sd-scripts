# @package adapter

# Active adapter config surface.
# `adapter.peft.<method>` branch presence selects the PEFT method.
# The default adapter group composes the shared PEFT shell plus the LoRA method
# settings under `adapter.peft.lora`, so adapter-mode presets always have one
# concrete adapter config unless they override that branch explicitly.

defaults:
  - peft@peft: default
  - peft@peft.lora: lora
  - _self_

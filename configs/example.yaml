# ═══════════════════════════════════════════════════════════════════════════
# EXAMPLE: SDXL LoRA Training Config (Schema 1 with explicit model_type/method)
# ═══════════════════════════════════════════════════════════════════════════

# ─── MODEL ──────────────────────────────────────────────────────────────────
model:
  model_type: sdxl                    # sd15 | sd2 | sdxl | flux
  pretrained_model_name_or_path: "stabilityai/stable-diffusion-xl-base-1.0"
  vae: null

# ─── TRAINING ───────────────────────────────────────────────────────────────
training:
  method: peft                        # peft | finetune | textual_inversion
  max_train_epochs: 10
  train_batch_size: 2
  gradient_accumulation_steps: 4
  seed: 42
  max_token_length: 225
  clip_skip: 2

# ─── DATASET ────────────────────────────────────────────────────────────────
dataset:
  train_data_dir: "./dataset/my_character"
  resolution: 1024
  enable_bucket: true
  cache_latents: true

buckets:
  min_bucket_reso: 512
  max_bucket_reso: 2048

# ─── PEFT (only relevant when training.method: peft) ───────────────────────
peft:
  adapter_rank: 32
  adapter_alpha: 16
  module: "lycoris.kohya"
  adapter_args: ["algo=loha", "preset=full"]
  conv_dim: 16

# ─── OPTIMIZER ──────────────────────────────────────────────────────────────
optimizer:
  optimizer_type: "AdamW8bit"
  learning_rate: 1e-4
  learning_rates:
    unet: 1e-4
    text_encoders: [5e-5, 5e-5]       # Training for both text encoders SDXL
  lr_scheduler: "cosine_with_restarts"
  lr_warmup_steps: 0.05

# ─── PERFORMANCE ────────────────────────────────────────────────────────────
performance:
  precision:
    mixed_precision: "bf16"
  memory:
    gradient_checkpointing: true
  attention:
    sdpa: true
  caching:
    cache_text_encoder_outputs: true

# ─── LOSS ───────────────────────────────────────────────────────────────────
loss:
  loss_type: "l2"
  snr:
    min_snr_gamma: 5.0
  regularization:
    noise_offset: 0.0357

# ─── OUTPUT ─────────────────────────────────────────────────────────────────
output:
  saving:
    output_dir: "./output"
    output_name: "my_sdxl_loha"
    save_model_as: "safetensors"
    save_every_n_epochs: 2
  logging:
    logging_dir: "./logs"
    log_with: "wandb"
  sampling:
    sample_every_n_epochs: 1
    sample_prompts: "./prompts.txt"
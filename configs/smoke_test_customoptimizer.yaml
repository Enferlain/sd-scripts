# ═══════════════════════════════════════════════════════════════════════════
# SDXL PEFT Test Config - Seele v-pred model
# ═══════════════════════════════════════════════════════════════════════════
# Usage: python scripts/sdxl_peft.py --config-name=smoke_test

defaults:
  - run_schema
  - _self_

mode: peft

# ─── MODEL ──────────────────────────────────────────────────────────────────
model:
  model_type: sdxl
  pretrained_model_name_or_path: "D:/stable-diffusion-webui-reForge/models/Stable-diffusion/21862-seele_pop3_v-pred.safetensors"
  vae: null

# ─── TRAINING ───────────────────────────────────────────────────────────────
training:
  max_train_steps: 100
  train_batch_size: 1
  gradient_accumulation_steps: 1
  seed: 218
  max_token_length: 225

# ─── DATA ────────────────────────────────────────────────────────────────────
data:
  source:
    train_data_dir: "D:/Projects/sd-scripts/tests/assets/images"
    dataset_repeats: 1
  preprocessing:
    resolution: "1024,1024"
  caption:
    shuffle_caption: true
    caption_extension: ".txt"
    keep_tokens_separator: "|||"
  bucketing:
    enable_bucket: true
    min_bucket_reso: 256
    max_bucket_reso: 1024
    bucket_reso_steps: 64
  caching:
    cache_latents: true
    cache_latents_to_disk: true
    cache_dir: "D:/Projects/sd-scripts/tests/assets/images"
  loader:
    num_workers: 0
    persistent_workers: false
    prefetch_factor: 2
    pin_memory: true


# ─── PEFT (adapter configuration) ───────────────────────────────────────────
peft:
  adapter_module: "library.adapters.lora"
  adapter_rank: 32
  adapter_alpha: 16.0
  adapter_args: ["conv_dim=32", "conv_alpha=16.0"]

# ─── OPTIMIZER ──────────────────────────────────────────────────────────────
optimizer:
  optimizer_type: "LoraEasyCustomOptimizer.ademamix.SimplifiedAdEMAMixExM"
  max_grad_norm: 0.0
  optimizer_args:
    - "weight_decay=0.01"
    - "betas=0.95, 0.997"
    - "alpha=1.0"
    - "beta1_warmup=2000"
    - "min_beta1=0.9"
    - "eps=1e-8"
    - "eps_floor=1e-12"
    - "use_ortho_grad=True"
    - "use_newton_schulz=True"
    - "use_stable_spam_clipping=True"
    - "use_compass=False"
    - "use_adabelief=True"
    - "update_strategy=cautious"
    - "update_strategy_scale=1.0"
    - "amsgrad_min_decay_rate=0.98"
    - "amsgrad_max_decay_rate=0.98"
    - "torch_compile=False"
  learning_rates:
    base: 1e-4
  scheduler:
    lr_scheduler: "cosine"
    lr_scheduler_type: "LoraEasyCustomOptimizer.RexAnnealingWarmRestarts.RexAnnealingWarmRestarts"
    lr_scheduler_num_cycles: 3
    lr_scheduler_args:
      - "min_lr=1e-07"
      - "gamma=0.9"
      - "d=0.85"
      - "warmup_steps=50"
      - "first_cycle_max_steps=333"

# ─── PERFORMANCE ────────────────────────────────────────────────────────────
performance:
  precision:
    mixed_precision: "bf16"
    no_half_vae: true
  memory:
    gradient_checkpointing: true
  attention:
    xformers: true

# ─── LOSS ───────────────────────────────────────────────────────────────────
loss:
  v_parameterization: true
  loss_type: "huber"
  huber:
    huber_c: 0.1
    huber_schedule: "snr"
  snr:
    min_snr_gamma: 1.0
  regularization:
    zero_terminal_snr: true
  prior_loss_weight: 1.0

# ─── TIMESTEP ───────────────────────────────────────────────────────────────
timestep:
  timestep_sampling: "uniform"
  min_timestep: 0
  max_timestep: 1000

# ─── OUTPUT ─────────────────────────────────────────────────────────────────
output:
  saving:
    output_dir: "D:/stable-diffusion-webui-reForge/models/new_test"
    output_name: "newtest1"
    save_model_as: "safetensors"
    save_precision: "fp16"
    save_every_n_steps: 50
    save_every_n_epochs: 0

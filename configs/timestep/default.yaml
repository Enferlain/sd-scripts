# Timestep configuration
timestep_sampling: uniform # uniform | shift | mix_adaptive | tempered_adaptive | gaussian_mid_snr | snr_windowed | log_snr_uniform
min_timestep: null
max_timestep: null
dynamic_timestep_schedule: null
sigmoid_scale: 1.0
discrete_flow_shift: 1.0

# Original loss-aware sampler
mix_adaptive:
  bins: 32
  ema_beta: 0.9
  start_p: 0.85
  end_p: 0.35
  fixed_p: null
  anneal: cosine
  small_t_frac: 0.15
  small_t_cap: 0.6

# Tempered adaptive sampler
tempered_adaptive:
  bins: 32
  ema_beta: 0.9
  temperature: 0.5
  prior_weight: 0.2
  min_prob: 0.0001
  warmup_steps: 2000
  prior_bias: 0.8
  entropy_floor: 0.7

# Gaussian mid-SNR sampler
gaussian_mid_snr:
  bins: 32
  ema_beta: 0.9
  temperature: 0.5
  min_prob: 0.0001
  entropy_floor: 0.7
  prior_mu: 0.0
  prior_sigma: 1.0
  prior_weight: 0.2
  warmup_steps: 2000
  uniform_mix_when_low_entropy: 0.1

# SNR windowed sampler
snr_windowed:
  bins: 32
  ema_beta: 0.9
  temperature: 0.5
  min_prob: 0.0001
  entropy_floor: 0.7
  center_mu: 0.0
  half_width: 0.8
  widen_to: 2.5
  max_train_steps: 2000
  cap_max_t: 950
  uniform_mix_when_low_entropy: 0.1

# @package _global_
# ═══════════════════════════════════════════════════════════════════════════
# SDXL PEFT Benchmark - Tunable Config
# ═══════════════════════════════════════════════════════════════════════════
# Usage: python scripts/sdxl_peft.py --config-name=benchmarks/benchmark_sdxl_tunable
#
# Purpose: Single config file exposing all key performance knobs for benchmarking.
#          Modify the values below to test different configurations.
# ═══════════════════════════════════════════════════════════════════════════

defaults:
  - /run_schema
  - _self_

mode: peft

# ─── MODEL ──────────────────────────────────────────────────────────────────
model:
  model_type: sdxl
  pretrained_model_name_or_path: "D:/stable-diffusion-webui-reForge/models/Stable-diffusion/21862-seele_pop3_v-pred.safetensors"
  vae: null

# ─── TRAINING [TUNABLE] ─────────────────────────────────────────────────────
training:
  train_batch_size: 2                # Adjust based on VRAM (e.g. 1, 2, 4)
  gradient_accumulation_steps: 1     # Increase to simulate larger effective batch size
  max_train_steps: 50
  seed: 42
  max_token_length: 225

# ─── DATA [TUNABLE] ─────────────────────────────────────────────────────────
data:
  source:
    train_data_dir: "D:/Projects/sd-scripts/tests/assets/training_images"
    dataset_repeats: 1               # Increase to test larger epoch sizes
  
  preprocessing:
    resolution: "1024,1024"          # Base training resolution
  
  bucketing:
    enable_bucket: true
    min_bucket_reso: 256
    max_bucket_reso: 1024            # MUST match resolution (max dimension)
    bucket_reso_steps: 64
  
  caching:
    # ─── Latents ───
    cache_latents: true              # Set to false to test on-the-fly VAE encoding
    cache_latents_to_disk: true      # Set to false to cache in RAM (faster, more RAM usage)
    vae_batch_size: 1                # Batch size for VAE encoding (caching step)
    te_batch_size: 8                 # Batch size for TE encoding (caching step)
    
    # ─── Text Encoders ───
    cache_text_encoder_outputs: true         # Set to false to train TEs or encoding on-the-fly
    cache_text_encoder_outputs_to_disk: true # Set to false to cache in RAM
    
    # ─── General Caching ───
    cache_dir: "D:/Projects/sd-scripts/benchmark_cache"
    cache_tokens_per_epoch: false
    num_workers: 4                   # Workers used during the Caching phase (not training)

  loader:
    # ─── DataLoader Settings (Training Phase) ───
    num_workers: 4                   # 0 = main process. >0 uses subprocesses (Windows overhead warning)
    persistent_workers: true        # Keep workers alive between epochs (requires num_workers > 0)
    prefetch_factor: 2               # Batches loaded in advance (requires num_workers > 0)
    pin_memory: true                 # Faster transfer to GPU

  caption:
    shuffle_caption: false
    caption_extension: ".txt"
    keep_tokens_separator: "|||"

# ─── PEFT ───────────────────────────────────────────────────────────────────
peft:
  adapter_module: "library.adapters.lora"
  lora:
    rank: 32
    alpha: 16.0
    conv_rank: 32
    conv_alpha: 16.0

# ─── OPTIMIZER [TUNABLE] ────────────────────────────────────────────────────
optimizer:
  optimizer_type: "AdamW8bit"
  max_grad_norm: 1.0
  optimizer_args:
    - "weight_decay=0.01"
    - "betas=0.9, 0.999"
  learning_rates:
    base: 1e-4
    denoiser: 1e-5
    # Important: If cache_text_encoder_outputs is true OR offload_text_encoders is true,
    # these MUST be set to 0. If training TEs (no cache), set to e.g. [1e-5, 1e-5].
    text_encoders: [0, 0]
  scheduler:
    lr_scheduler: "constant"

# ─── PERFORMANCE [TUNABLE] ──────────────────────────────────────────────────
performance:
  precision:
    mixed_precision: "bf16"
    no_half_vae: true                # Keep VAE in float32 for stability
  
  memory:
    gradient_checkpointing: true     # Saves VRAM at cost of compute speed
    offload_text_encoders: false     # Offload TEs to CPU to save VRAM (incompatible with TE training)
  
  attention:
    xformers: true                   # Facebook's xFormers memory efficient attention
    sdpa: false                      # PyTorch 2.0 Scaled Dot Product Attention (if xformers=false)

# ─── LOSS ───────────────────────────────────────────────────────────────────
objective:
  prediction: "v_prediction"

loss:
  v_parameterization: true
  loss_type: "l2"
  regularization:
    zero_terminal_snr: true
  snr:
    min_snr_gamma: 5.0
  prior_loss_weight: 1.0

# ─── TIMESTEP ───────────────────────────────────────────────────────────────
timestep:
  timestep_sampling: "uniform"
  min_timestep: 0
  max_timestep: 1000

# ─── OUTPUT ─────────────────────────────────────────────────────────────────
output:
  saving:
    output_dir: "D:/Projects/sd-scripts/benchmark_output"
    output_name: "benchmark_sdxl_tunable"
    save_model_as: "safetensors"
    save_precision: "fp16"
    save_every_n_steps: 999999
    save_every_n_epochs: 999999
  sampling:
    sample_every_n_steps: 0
    sample_at_first: false
    sample_every_n_epochs: null

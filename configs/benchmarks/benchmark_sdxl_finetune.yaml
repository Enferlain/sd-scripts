# @package _global_
# ═══════════════════════════════════════════════════════════════════════════
# SDXL Full-Model Fine-Tune Benchmark Config
# ═══════════════════════════════════════════════════════════════════════════
# Usage: python scripts/sdxl_finetune.py --config-name=benchmarks/benchmark_sdxl_finetune
#
# Mirrors benchmark_sdxl but uses the shared fine-tune config (no peft/adapter).
# Trains UNet + TEs directly. Much higher VRAM usage than LoRA.

defaults:
  - /run_schema
  - _self_

mode: finetune

# ─── MODEL ──────────────────────────────────────────────────────────────────
model:
  model_type: sdxl
  pretrained_model_name_or_path: "D:/stable-diffusion-webui-reForge/models/Stable-diffusion/21862-seele_pop3_v-pred.safetensors"
  vae: null

# ─── TRAINING ───────────────────────────────────────────────────────────────
training:
  max_train_steps: 50
  train_batch_size: 2
  gradient_accumulation_steps: 1
  seed: 42
  max_token_length: 225

# ─── DATA ────────────────────────────────────────────────────────────────────
data:
  source:
    train_data_dir: "D:/Projects/sd-scripts/tests/assets/training_images"
    dataset_repeats: 1
  preprocessing:
    resolution: "1024,1024"
  caption:
    shuffle_caption: false
    caption_extension: ".txt"
    keep_tokens_separator: "|||"
  bucketing:
    enable_bucket: true
    min_bucket_reso: 256
    max_bucket_reso: 1024
    bucket_reso_steps: 64
  caching:
    cache_latents: true
    cache_latents_to_disk: true
    cache_text_encoder_outputs: true
    cache_text_encoder_outputs_to_disk: true
    cache_tokens_per_epoch: false
    cache_dir: "D:/Projects/sd-scripts/benchmark_cache"
    vae_batch_size: 2
    te_batch_size: 8
    num_workers: 4
  loader:
    num_workers: 0
    persistent_workers: true
    prefetch_factor: 2
    pin_memory: true

# ─── NO PEFT SECTION ─── (this is full-model fine-tuning)

# ─── OPTIMIZER ──────────────────────────────────────────────────────────────
optimizer:
  optimizer_type: "AdamW8bit"
  max_grad_norm: 1.0
  optimizer_args:
    - "weight_decay=0.01"
    - "betas=0.9, 0.999"
  learning_rates:
    base: 1e-6             # Lower LR for full-model stability
    denoiser: 1e-6
    text_encoders: [0, 0]  # TEs frozen for this benchmark (cached to disk)
  scheduler:
    lr_scheduler: "constant"

# ─── PERFORMANCE ────────────────────────────────────────────────────────────
performance:
  precision:
    mixed_precision: "bf16"
    no_half_vae: true
  memory:
    gradient_checkpointing: true
    offload_text_encoders: false
  attention:
    xformers: true

# ─── LOSS ───────────────────────────────────────────────────────────────────
objective:
  prediction: "v_prediction"

loss:
  v_parameterization: true
  loss_type: "l2"
  regularization:
    zero_terminal_snr: true
  snr:
    min_snr_gamma: 5.0
  prior_loss_weight: 1.0

# ─── TIMESTEP ───────────────────────────────────────────────────────────────
timestep:
  timestep_sampling: "uniform"
  min_timestep: 0
  max_timestep: 1000

# ─── OUTPUT ─────────────────────────────────────────────────────────────────
output:
  saving:
    output_dir: "D:/Projects/sd-scripts/benchmark_output"
    output_name: "benchmark_finetune"
    save_model_as: "safetensors"
    save_precision: "fp16"
    save_every_n_steps: 999999
    save_every_n_epochs: 999999
  sampling:
    sample_vae_dtype: fp16
    sample_every_n_steps: 0
    sample_at_first: false
    sample_every_n_epochs: null
    sample_prompt_file: null

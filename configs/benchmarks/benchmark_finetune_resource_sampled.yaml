# @package _global_
# ═══════════════════════════════════════════════════════════════════════════
# SDXL Fine-Tune Benchmark: Resource Monitor (Sampled)
# ═══════════════════════════════════════════════════════════════════════════
# Usage: python -m scripts.sdxl_finetune --config-name=benchmarks/benchmark_finetune_resource_sampled

defaults:
  - /benchmarks/benchmark_sdxl_finetune
  - _self_

output:
  saving:
    output_name: "benchmark_finetune_resource_sampled"
  logging:
    resource_monitor:
      enabled: true
      mode: "sampled"
      rank_scope: "main"
      log_every_n_steps: 0
      sample_interval_sec: 0.5
      output_jsonl: "resource_monitor.jsonl"

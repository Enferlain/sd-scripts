# @package _global_
# ═══════════════════════════════════════════════════════════════════════════
# SDXL PEFT Benchmark - No Caching (On-the-fly)
# ═══════════════════════════════════════════════════════════════════════════
# Usage: python scripts/sdxl_peft.py --config-name=benchmarks/benchmark_sdxl_no_cache
#
# Purpose: Test raw processing speed without any pre-caching.
#          Trains text encoders and computes VAE on-the-fly.
# ═══════════════════════════════════════════════════════════════════════════

defaults:
  - /benchmarks/benchmark_sdxl_tunable
  - _self_

data:
  caching:
    cache_latents: false
    cache_text_encoder_outputs: false
    # Disk caching irrelevant when caching is disabled, but good practice to disable
    cache_latents_to_disk: false
    cache_text_encoder_outputs_to_disk: false

optimizer:
  learning_rates:
    # Text Encoders are now trainable (or at least participating in graph)
    text_encoders: [1e-5, 1e-5]

output:
  saving:
    output_name: "benchmark_sdxl_no_cache"

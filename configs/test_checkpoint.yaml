# ═══════════════════════════════════════════════════════════════════════════
# SDXL PEFT Integration Test: Checkpointing
# ═══════════════════════════════════════════════════════════════════════════
# Usage: python scripts/sdxl_peft.py --config-name=test_checkpoint
# To test epoch ratio: add training.max_train_epochs=3 override

defaults:
  - test_core
  - _self_

training:
  max_train_steps: 50

output:
  saving:
    output_name: "test_checkpoint"
    save_every_n_steps: 10
    save_every_n_epochs: 1
    save_state: true
    save_n_epoch_ratio: 2
    no_metadata: false

# @package _global_

# ═══════════════════════════════════════════════════════════════════════════
# EXAMPLE: SDXL LoRA/LyCORIS Training Config
# ═══════════════════════════════════════════════════════════════════════════
# Usage: python train.py --config-name=presets/sdxl_peft +experiment=examples/example
# This file shows user overrides on top of the shared PEFT defaults.

# ─── MODE ───────────────────────────────────────────────────────────────────
mode: adapter

# ─── MODEL ──────────────────────────────────────────────────────────────────
model:
  model_type: sdxl # sd15 | sd2 | sdxl | flux
  pretrained_model_name_or_path: "stabilityai/stable-diffusion-xl-base-1.0"
  vae: null

# ─── TRAINING ───────────────────────────────────────────────────────────────
training:
  max_train_epochs: 10
  train_batch_size: 2
  gradient_accumulation_steps: 4
  seed: 42
  max_token_length: 225
  clip_skip: 2

# ─── DATA ────────────────────────────────────────────────────────────────────
data:
  source:
    train_data_dir: "./dataset/my_character"
  preprocessing:
    resolution: "1024,1024"
  caption:
    shuffle_caption: false
  bucketing:
    enable_bucket: true
    min_bucket_reso: 512
    max_bucket_reso: 2048
  caching:
    cache_latents: true

# ─── PEFT (adapter configuration) ───────────────────────────────────────────
adapter:
  peft:
    loha:
      rank: 32
      alpha: 16
      use_tucker: true

# ─── OPTIMIZER ──────────────────────────────────────────────────────────────
optimizer:
  optimizer_type: "AdamW8bit"
  learning_rates:
    base: 1e-4
    denoiser: 1e-4
    text_encoders: [5e-5, 5e-5] # Training both SDXL text encoders
  scheduler:
    lr_scheduler: "cosine_with_restarts"
    lr_warmup_steps: 100

# ─── PERFORMANCE ────────────────────────────────────────────────────────────
performance:
  precision:
    mixed_precision: "bf16"
  memory:
    gradient_checkpointing: true
  attention:
    sdpa: true
  caching:
    cache_text_encoder_outputs: true

# ─── LOSS ───────────────────────────────────────────────────────────────────
loss:
  loss_type: "l2"
  snr:
    min_snr_gamma: 5.0
  regularization:
    noise_offset: 0.0357

# ─── OUTPUT ─────────────────────────────────────────────────────────────────
output:
  saving:
    output_dir: "./output"
    output_name: "my_sdxl_loha"
    save_model_as: "safetensors"
    save_every_n_epochs: 2
  logging:
    logging_dir: "./logs"
    log_with: "wandb"
  sampling:
    sample_every_n_epochs: 1
    sample_prompt_file: "./prompts.txt"

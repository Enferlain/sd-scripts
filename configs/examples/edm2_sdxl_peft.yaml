# @package _global_

# ═══════════════════════════════════════════════════════════════════════════
# EXAMPLE: SDXL PEFT with EDM2 Loss Weighting
# ═══════════════════════════════════════════════════════════════════════════
# Usage: python scripts/sdxl_peft.py --config-name=examples/edm2_sdxl_peft
# This example starts from the regular SDXL PEFT preset and only layers on the
# EDM2-specific overrides that make the feature easy to try.

defaults:
  - /presets/sdxl_peft
  - _self_

loss:
  edm2:
    enabled: true
    importance:
      enabled: true
    optimizer:
      use_scheduler: true
    visualization:
      enabled: true
      every_n_steps: 100
      output_dir: "./edm2_plots"
  snr:
    min_snr_gamma: null

output:
  saving:
    output_name: "sdxl_peft_edm2"

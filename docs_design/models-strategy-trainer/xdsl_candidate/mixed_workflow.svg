<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-label="Mixed workflow: feedback, producer ownership, protected shared model and external stop inside one Engine"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#40566f"/></marker><style>text{font-family:system-ui,sans-serif;fill:#142c43;font-size:16px}.title{font-size:23px;font-weight:650}.small{font-size:14px}.line{fill:none;stroke:#40566f;stroke-width:2;marker-end:url(#a)}.feedback{stroke:#9355a4}.state{stroke:#16806d;stroke-dasharray:7 4}</style></defs><rect width="1200" height="800" fill="#f7fafc"/><rect x="20" y="20" width="1160" height="755" rx="18" fill="white" stroke="#8199b0" stroke-width="2"/><text x="45" y="55" class="title">Mixed pressure case · one existing owner Engine</text><rect x="40" y="82" width="540" height="595" rx="14" fill="#f1f6fc" stroke="#8ca6c4"/><text x="60" y="111">Producer lifetime · horizon 3 until feedback acknowledgement</text><rect x="650" y="82" width="490" height="430" rx="14" fill="#f8f4fc" stroke="#bba1ce"/><text x="670" y="111">Repeat: ordinary learning → explicit stop checkpoint</text><rect x="60" y="140" width="150" height="60" rx="9" fill="#fff" stroke="#8ca6c4"/><text x="135.0" y="164.5" text-anchor="middle">Cursor + policy</text><text x="135.0" y="185.5" text-anchor="middle">producer owned</text><rect x="260" y="140" width="120" height="60" rx="9" fill="#fff" stroke="#8ca6c4"/><text x="320.0" y="164.5" text-anchor="middle">Select</text><text x="320.0" y="185.5" text-anchor="middle">key + bias</text><rect x="410" y="140" width="145" height="60" rx="9" fill="#fff" stroke="#8ca6c4"/><text x="482.5" y="164.5" text-anchor="middle">Dynamic filter</text><text x="482.5" y="185.5" text-anchor="middle">revision &gt; 0</text><rect x="60" y="230" width="150" height="70" rx="9" fill="#fff" stroke="#8ca6c4"/><text x="135.0" y="259.5" text-anchor="middle">Policy receiver</text><text x="135.0" y="280.5" text-anchor="middle">apply + retire</text><rect x="410" y="260" width="145" height="45" rx="9" fill="#fff" stroke="#8ca6c4"/><text x="482.5" y="287.5" text-anchor="middle">Fanout</text><rect x="245" y="365" width="140" height="65" rx="9" fill="#fff" stroke="#8ca6c4"/><text x="315.0" y="392.0" text-anchor="middle">Pure local</text><text x="315.0" y="413.0" text-anchor="middle">double → offset</text><rect x="410" y="365" width="145" height="65" rx="9" fill="#fff" stroke="#8ca6c4"/><text x="482.5" y="392.0" text-anchor="middle">Protected read</text><text x="482.5" y="413.0" text-anchor="middle">model → detach</text><rect x="245" y="495" width="140" height="65" rx="9" fill="#fff" stroke="#8ca6c4"/><text x="315.0" y="522.0" text-anchor="middle">Left port</text><text x="315.0" y="543.0" text-anchor="middle">capacity 1</text><rect x="410" y="495" width="145" height="65" rx="9" fill="#fff" stroke="#8ca6c4"/><text x="482.5" y="522.0" text-anchor="middle">Right port</text><text x="482.5" y="543.0" text-anchor="middle">capacity 1</text><rect x="60" y="610" width="490" height="45" rx="9" fill="#fff" stroke="#8ca6c4"/><text x="305.0" y="637.5" text-anchor="middle">Close selection → join private work → release owner</text><rect x="680" y="140" width="170" height="65" rx="9" fill="#fff" stroke="#8ca6c4"/><text x="765.0" y="167.0" text-anchor="middle">Atomic join</text><text x="765.0" y="188.0" text-anchor="middle">ticket + snapshot</text><rect x="920" y="140" width="190" height="65" rx="9" fill="#fff" stroke="#8ca6c4"/><text x="1015.0" y="167.0" text-anchor="middle">Objective</text><text x="1015.0" y="188.0" text-anchor="middle">retained learner</text><rect x="920" y="270" width="190" height="65" rx="9" fill="#fff" stroke="#8ca6c4"/><text x="1015.0" y="297.0" text-anchor="middle">Differentiate</text><text x="1015.0" y="318.0" text-anchor="middle">release old state</text><rect x="680" y="270" width="170" height="65" rx="9" fill="#fff" stroke="#8ca6c4"/><text x="765.0" y="297.0" text-anchor="middle">Advance</text><text x="765.0" y="318.0" text-anchor="middle">SGD + reset</text><rect x="680" y="395" width="170" height="65" rx="9" fill="#fff" stroke="#8ca6c4"/><text x="765.0" y="422.0" text-anchor="middle">Post-step weight</text><text x="765.0" y="443.0" text-anchor="middle">input associations</text><rect x="920" y="395" width="190" height="65" rx="9" fill="#fff" stroke="#8ca6c4"/><text x="1015.0" y="422.0" text-anchor="middle">After 3 windows</text><text x="1015.0" y="443.0" text-anchor="middle">wait external stop</text><rect x="655" y="562" width="480" height="80" rx="9" fill="#eaf8f3" stroke="#8ca6c4"/><text x="895.0" y="596.5" text-anchor="middle">Shared trainable participant + optimization unit</text><text x="895.0" y="617.5" text-anchor="middle">Protected preprocessing reads / exclusive returned updates</text><rect x="820" y="700" width="315" height="50" rx="9" fill="#fff3e3" stroke="#8ca6c4"/><text x="977.5" y="730.0" text-anchor="middle">External stop request at checkpoint</text><path d="M210 170 H260" class="line "/><path d="M380 170 H410" class="line "/><path d="M482 200 V260" class="line "/><path d="M440 305 V340 H315 V365" class="line "/><path d="M510 305 V365" class="line "/><path d="M315 430 V495" class="line "/><path d="M482 430 V495" class="line "/><path d="M385 525 H600 V155 H680" class="line "/><path d="M555 545 H625 V190 H680" class="line "/><path d="M850 172 H920" class="line "/><path d="M1015 205 V270" class="line "/><path d="M920 300 H850" class="line "/><path d="M765 335 V395" class="line "/><path d="M850 427 H920" class="line "/><path d="M680 430 H610 V325 H135 V300" class="line feedback"/><path d="M135 230 V200" class="line feedback"/><text x="220" y="318" class="small" fill="#9355a4">bounded post-advance feedback</text><path d="M655 590 H590 V448 H482 V430" class="line state"/><path d="M850 320 H875 V540 H1050 V562" class="line state"/><text x="65" y="585" class="small">Model protection ends before any blocked publication.</text><path d="M1015 700 H1158 V475 H1015 V460" class="line feedback"/><path d="M1110 425 H1150 V675 H565 V635 H550" class="line feedback"/><text x="660" y="665" class="small">Stop: discard unclaimed handoffs; physical failure still propagates.</text><text x="45" y="765" class="small">Snapshot admission: same binding, actual protected production epoch; older detached features may be admitted.</text></svg>